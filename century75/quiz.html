<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit Quiz · Century in 75 · Bhavishya SMS</title>
<meta name="description" content="Take today's Century in 75 exit quiz: 10 questions, instant score and explanations, and a place on the weekly leaderboard.">
<meta name="theme-color" content="#F8F5EC">
<link rel="icon" href="img/logo_tree_transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="c75.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="../index.html"><img class="tree" src="img/logo_tree_transparent.png" alt=""></a>
    <img class="word" src="img/logo_wordmark_transparent.png" alt="Bhavishya SMS">
    <span class="spacer"></span>
    <a class="pill" href="leaderboard.html">🏆 Leaderboard</a>
  </header>

  <section class="hero">
    <div class="kicker" id="kicker">Century in 75 · Exit Quiz</div>
    <h1 id="title">Loading today's <mark>quiz</mark>…</h1>
    <ul class="topics" id="topics"></ul>
  </section>

  <main id="main" aria-live="polite"></main>
  <p class="foot muted">10 questions · 1 mark each · about 10 minutes. No notes, no searching: the score is for you.</p>
</div>

<script src="c75.js"></script>
<script>
(function () {
  var el = C75.el, main = document.getElementById('main');
  var params = new URLSearchParams(location.search);
  var Q = null, answers = [], startedAt = 0, me = C75.store.get('me') || {};

  function show() { main.innerHTML = ''; for (var i = 0; i < arguments.length; i++) if (arguments[i]) main.appendChild(arguments[i]); window.scrollTo(0, 0); }
  function errorCard(msg, retry) {
    return el('div', { class: 'card' }, [
      el('h2', { text: 'Could not load the quiz' }), el('p', { class: 'muted', text: msg }),
      retry ? el('button', { class: 'btn dark', text: 'Try again', onclick: retry }) : null
    ]);
  }

  function load() {
    C75.get({ day: params.get('day') }).then(function (q) { Q = q; render(); })
      .catch(function (e) { show(errorCard(C75.configured || location.hostname === 'localhost' ? e.message : 'The quiz is not connected yet. Please check back soon.', load)); });
  }

  function header() {
    document.getElementById('kicker').textContent = 'Century in 75 · Week ' + Q.week + ' · ' + C75.fmtDate(Q.date);
    var t = document.getElementById('title'); t.innerHTML = '';
    t.append('Day ' + C75.pad(Q.day) + ' ', el('mark', { text: 'Exit Quiz' }));
    var ul = document.getElementById('topics'); ul.innerHTML = '';
    (Q.topics || []).forEach(function (tp) { ul.appendChild(el('li', {}, [el('b', { text: tp.subject }), tp.topic])); });
    document.title = 'Day ' + C75.pad(Q.day) + ' Exit Quiz · Century in 75';
  }

  function otherDays() {
    var past = (Q.days || []).filter(function (d) { return d !== Q.day && d <= Q.today; });
    if (!past.length) return null;
    return el('div', { class: 'card' }, [
      el('h2', { text: 'Practise other days' }),
      el('p', { class: 'muted small', text: 'Only the first attempt on the day itself (before 11 PM) counts for the leaderboard.' }),
      el('div', { class: 'topics' }, past.map(function (d) { return el('a', { class: 'pill', href: '?day=' + d, text: 'Day ' + C75.pad(d) }); }))
    ]);
  }

  function promo() {  // plans card: an offer during the free week, a requirement after it
    return Q.free
      ? C75.plans({ title: 'Keep going after Week 1', sub: 'Week 1 is free till ' + C75.fmtDate(Q.freeUntilDate) + '. From Day 8, the exit quizzes, leaderboard, sheets and answer keys continue with a pass.' })
      : C75.plans({ title: 'Get a pass to take this quiz', sub: 'Every pass includes all 75 exit quizzes and the leaderboard.' });
  }

  function banner() {
    var hero = document.querySelector('.hero'), old = document.querySelector('.free-banner');
    if (old) old.remove();
    var b = Q.free ? C75.freeBanner() : null;
    if (b) hero.appendChild(b);
  }

  function gate(phone) {
    show(el('div', { class: 'card gate' }, [
      el('div', { class: 'lock', text: '🔒' }),
      el('h2', { text: 'Day ' + C75.pad(Q.day) + ' is for Century in 75 pass holders' }),
      el('p', { class: 'muted', text: 'We could not find a pass for +91 ' + (phone || me.phone || '') + '. If you paid with a different number, try that one. Just paid? Access turns on within 10 minutes.' }),
      el('button', { class: 'btn dark', text: 'Try another number', onclick: details })
    ]), promo(), otherDays());
  }

  function render() {
    header();
    banner();
    if (!Q.open) return locked();
    var done = C75.store.get('done_' + Q.day);
    if (done && !params.get('retake')) return already(done);
    details();
  }

  function locked() {
    var box = el('p', { class: 'big', style: 'font-weight:900;font-size:40px;margin:6px 0' });
    function tick() {
      var s = Math.max(0, Math.round((Q.openAt - Date.now()) / 1000));
      box.textContent = s > 86400 ? C75.fmtDate(Q.date) + ', ' + C75.fmtTime(Q.openAt)
        : Math.floor(s / 3600) + 'h ' + C75.pad(Math.floor(s / 60) % 60) + 'm ' + C75.pad(s % 60) + 's';
      if (s === 0) { clearInterval(iv); load(); }
    }
    var iv = setInterval(tick, 1000); tick();
    show(el('div', { class: 'card score' }, [
      el('h2', { text: 'Quiz opens at ' + C75.fmtTime(Q.openAt) }), box,
      el('p', { class: 'muted', text: 'Solve the practice sheet first. The quiz unlocks with the sheet and counts for the leaderboard until ' + C75.fmtTime(Q.countUntil) + '.' }),
      Q.free ? null : el('p', { class: 'muted small', text: 'From Day 8 the exit quiz is for pass holders: use the WhatsApp number you paid with.' })
    ]), otherDays(), promo());
  }

  function already(done) {
    show(el('div', { class: 'card score' }, [
      el('h2', { text: 'You already took the Day ' + C75.pad(Q.day) + ' quiz' }),
      el('div', { class: 'big', text: done.score + '' }, [el('small', { text: '/' + done.outOf })]),
      el('a', { class: 'btn', href: 'leaderboard.html', text: '🏆 See the leaderboard' }),
      el('a', { class: 'btn dark', href: '?day=' + Q.day + '&retake=1', text: 'Take it again (practice, not counted)' })
    ]), Q.free ? promo() : null, otherDays());
  }

  function details() {
    var name = el('input', { class: 'in', id: 'nm', autocomplete: 'name', maxlength: '40', placeholder: 'e.g. Riya Sharma', value: me.name || '' });
    var phone = el('input', { class: 'in', id: 'ph', type: 'tel', inputmode: 'numeric', autocomplete: 'tel-national', maxlength: '14', placeholder: '98765 43210', value: me.phone || '' });
    var err = el('div', { class: 'err', hidden: '' });
    function go(e) {
      e.preventDefault();
      var n = name.value.replace(/\s+/g, ' ').trim(), p = phone.value.replace(/\D/g, '');
      if (p.length > 10) p = p.slice(-10);
      if (n.length < 2) return fail('Please write your name.');
      if (!/^[6-9]\d{9}$/.test(p)) return fail('Please enter your 10-digit WhatsApp number.');
      me = { name: n, phone: p }; C75.store.set('me', me);
      if (Q.items) return questions();  // free day: questions already here
      var btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Checking your pass…';
      C75.post({ action: 'quiz', day: Q.day, phone: p }).then(function (r) {
        if (r.items) { Q.items = r.items; Q.pass = r.pass; questions(); } else gate(p);
      }).catch(function (x) { btn.disabled = false; btn.textContent = 'Start the quiz →'; fail(x.message); });
    }
    function fail(m) { err.textContent = m; err.hidden = false; }
    var practice = !Q.counting || params.get('retake');
    show(
      practice ? el('div', { class: 'note warn', text: params.get('retake') ? 'Practice attempt: it will not change your leaderboard score.'
        : 'Leaderboard time for Day ' + C75.pad(Q.day) + ' ended at ' + C75.fmtTime(Q.countUntil) + '. You can still practise; this attempt won\'t count.' }) : null,
      el('form', { class: 'card', onsubmit: go, novalidate: '' }, [
        el('h2', { text: 'Before you start' }),
        el('p', { class: 'muted small', text: 'Your name goes on the leaderboard. Your WhatsApp number is never shown; we use it to keep your scores together and for Century in 75 updates.' }),
        Q.free ? null : el('p', { class: 'note small', text: 'Day 8 onwards is for pass holders: use the WhatsApp number you paid with.' }),
        el('label', { class: 'f', for: 'nm', text: 'Your name' }), name,
        el('label', { class: 'f', for: 'ph', text: 'WhatsApp number' }), el('div', { class: 'phone' }, [el('span', { text: '+91' }), phone]),
        err,
        el('button', { class: 'btn', type: 'submit', text: 'Start the quiz →' })
      ]), otherDays(), Q.free ? promo() : null);
    if (!me.name) name.focus();
  }

  function questions() {
    answers = Q.items.map(function () { return -1; });
    startedAt = Date.now();
    var wrap = el('div'), cur = '';
    var fill = el('div', { class: 'fill' }), count = el('span', { class: 'count', text: '0 / ' + Q.items.length });
    var submitBtn = el('button', { class: 'btn', type: 'button', text: 'Submit', onclick: submit });
    function update() {
      var n = answers.filter(function (a) { return a >= 0; }).length;
      fill.style.width = (n / Q.items.length * 100) + '%'; count.textContent = n + ' / ' + Q.items.length;
    }
    Q.items.forEach(function (it, i) {
      if (it.subject !== cur) { cur = it.subject; wrap.appendChild(el('div', { class: 'sec', text: cur })); }
      var opts = el('div', { class: 'opts', role: 'radiogroup' });
      it.choices.forEach(function (c, k) {
        var input = el('input', { type: 'radio', name: 'q' + i, value: k, 'aria-label': c });
        var lab = el('label', { class: 'opt' }, [input, el('span', { class: 'k', text: 'abcd'.charAt(k) }), el('span', { text: c })]);
        input.addEventListener('change', function () {
          answers[i] = k;
          Array.prototype.forEach.call(opts.children, function (o) { o.classList.remove('sel'); });
          lab.classList.add('sel'); update();
        });
        opts.appendChild(lab);
      });
      wrap.appendChild(el('div', { class: 'card q', id: 'q' + i }, [
        el('div', { class: 'num', text: 'Q' + (i + 1) }),
        el('div', { class: 'qt', text: it.title }),
        it.help ? el('p', { class: 'help', text: it.help }) : null, opts
      ]));
    });
    var bar = el('div', { class: 'bar' }, [el('div', { class: 'track' }, [fill]), count, submitBtn]);
    show(wrap, bar);

    function submit() {
      var left = answers.filter(function (a) { return a < 0; }).length;
      if (left && !confirm(left + (left === 1 ? ' question is' : ' questions are') + ' not answered. Submit anyway?')) {
        var first = answers.indexOf(-1); document.getElementById('q' + first).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      submitBtn.disabled = true; submitBtn.textContent = 'Checking…';
      C75.post({ action: 'submit', day: Q.day, name: me.name, phone: me.phone, answers: answers, seconds: Math.round((Date.now() - startedAt) / 1000) })
        .then(result)
        .catch(function (e) {
          if (e.data && e.data.needPass) return gate(me.phone);
          submitBtn.disabled = false; submitBtn.textContent = 'Submit'; alert(e.message + '\nYour answers are still here. Please try again.'); });
    }
  }

  function result(r) {
    if (r.counted || !C75.store.get('done_' + Q.day)) C75.store.set('done_' + Q.day, { score: r.score, outOf: r.outOf });
    var pct = Math.round(r.score / r.outOf * 100);
    var msg = r.counted
      ? (r.rank ? 'You are #' + r.rank.rank + ' of ' + r.rank.of + ' on this week\'s leaderboard so far.' : 'Your score is on the leaderboard.')
      : r.note === 'repeat' ? 'Practice attempt: your first attempt today is the one on the leaderboard.'
      : 'Practice attempt: leaderboard time for this day is over.';
    var cheer = pct === 100 ? 'Full marks! 💯' : pct >= 80 ? 'Strong. Fix the misses below.' : pct >= 50 ? 'Good start. Read every explanation below.' : 'Read the explanations, then redo the sheet questions.';
    var review = el('div', { class: 'review' }), cur = '';
    Q.items.forEach(function (it, i) {
      var res = r.results[i];
      if (it.subject !== cur) { cur = it.subject; review.appendChild(el('div', { class: 'sec', text: cur })); }
      var ok = res.chosen === res.correct;
      review.appendChild(el('div', { class: 'card q' }, [
        el('div', { class: 'num' }, ['Q' + (i + 1), el('span', { class: 'badge ' + (ok ? 'ok' : res.chosen < 0 ? 'skip' : 'no'), text: ok ? '✓ Correct' : res.chosen < 0 ? 'Not answered' : '✗ Wrong' })]),
        el('div', { class: 'qt', text: it.title }), it.help ? el('p', { class: 'help', text: it.help }) : null,
        el('div', { class: 'opts' }, it.choices.map(function (c, k) {
          var cls = 'opt' + (k === res.correct ? ' right' : k === res.chosen ? ' wrong' : '');
          return el('div', { class: cls }, [el('span', { class: 'k', text: 'abcd'.charAt(k) }), el('span', { text: c })]);
        })),
        el('div', { class: 'why' }, [el('b', { text: 'Why: ' }), res.why])
      ]));
    });
    var ring = el('div', { class: 'ring', style: '--p:' + pct }, [el('div', {}, [el('div', { class: 'big' }, [r.score + '', el('small', { text: '/' + r.outOf })])])]);
    show(el('div', { class: 'card score' }, [
      el('div', { class: 'kicker', text: me.name + ' · Day ' + C75.pad(Q.day) }), ring,
      el('h2', { text: cheer }),
      el('div', { class: 'note' + (r.counted ? '' : ' warn'), text: msg }),
      el('a', { class: 'btn', href: 'leaderboard.html', text: '🏆 See the leaderboard' }),
      el('p', { class: 'muted small', text: 'Answer key for the practice sheet comes at 11 PM on the Bhavishya WhatsApp Channel.' }),
      Q.free && C75.freeDaysLeft() ? C75.freeBanner() : null
    ]), review, Q.free ? promo() : null);
  }

  load();
})();
</script>
</body>
</html>
